{% extends "layout.html" %}

{% block page_title %}Saved Favorite Properties{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <div class="card-title"><i class="fa-solid fa-bookmark"></i> Shortlisted Properties</div>
    </div>

    <div id="favoritesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
        <div style="color: var(--text-secondary); padding: 20px;">Loading favorites...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadFavorites() {
        try {
            const res = await fetch('/api/favorites');
            const data = await res.json();

            const grid = document.getElementById('favoritesGrid');
            if (data.length === 0) {
                grid.innerHTML = '<div style="color: var(--text-secondary); padding: 30px; grid-column: 1/-1; text-align: center;">No favorite properties saved yet. Click "Favorite" on the Predictor page to save configurations.</div>';
                return;
            }

            grid.innerHTML = data.map(f => `
                <div style="background: var(--bg-input); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); position: relative;">
                    <div style="font-weight: 800; font-size: 1.1rem; color: #fff; margin-bottom: 4px;">${f.property_name}</div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary);"><i class="fa-solid fa-location-dot"></i> ${f.location}</div>
                    
                    <div style="margin: 14px 0; font-size: 0.9rem; color: var(--text-secondary);">
                        ${f.total_sqft.toLocaleString()} sqft | ${f.bhk} BHK | ${f.bath} Bath | ${f.age} yrs
                    </div>

                    <div style="font-size: 1.4rem; font-weight: 800; color: var(--primary);">₹${f.predicted_price_lakhs} Lakhs</div>
                    <div style="font-size: 0.8rem; color: var(--accent-cyan); font-weight: 600;">₹${f.price_per_sqft.toLocaleString()}/sqft</div>

                    <button onclick="removeFavorite(${f.id})" class="btn-secondary btn-sm" style="margin-top: 14px; width: 100%; justify-content: center; color: var(--accent-amber);">
                        <i class="fa-solid fa-trash"></i> Remove
                    </button>
                </div>
            `).join('');

        } catch (err) {
            console.error("Favorites load error:", err);
        }
    }

    async function removeFavorite(id) {
        try {
            await fetch(`/api/favorites/${id}`, { method: 'DELETE' });
            showToast("Property removed from favorites", "info");
            loadFavorites();
        } catch (err) {
            showToast("Error deleting favorite", "error");
        }
    }

    window.onload = loadFavorites;
</script>
{% endblock %}
